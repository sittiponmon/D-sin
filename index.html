<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f0e0">
  <title>สินค้า - Products</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      padding: 0;
      background: #f6f0e0;
    }
    body {
      min-height: 100vh;
      color: #090909;
      font-family: Arial, Tahoma, sans-serif;
    }
    .document {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 0;
      background: #f6f0e0;
    }
    .screen {
      position: relative;
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f6f0e0;
      box-shadow: none;
      line-height: 0;
    }
    .screen > img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }
    .image-fallback {
      display: none;
      min-height: 300px;
      padding: 40px 20px;
      color: #6e5b3e;
      background: #f6f0e0;
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
    }
    .screen.failed > img { display: none; }
    .screen.failed > .image-fallback { display: grid; place-items: center; }
    .hotspot {
      position: absolute;
      z-index: 3;
      display: block;
      border-radius: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(80, 60, 20, 0.14);
    }
    .hotspot:hover {
      background: rgba(110, 83, 40, 0.07);
      outline: 2px solid rgba(70, 53, 25, 0.14);
    }
    .hotspot:focus-visible {
      background: rgba(110, 83, 40, 0.10);
      outline: 3px solid #7a5d2e;
      outline-offset: -3px;
    }
    @media (max-width: 720px) {
      .document { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="document">
    <!-- สินค้า.png -->
    <section class="screen" aria-label="สินค้า">
      <img
        src="https://drive.google.com/thumbnail?id=115PevwL2TrlxDjZIXbkTaSa6kNlhE-tJ&sz=w2000"
        alt="สินค้า"
        referrerpolicy="no-referrer"
        onerror="this.parentElement.classList.add('failed')"
      >
      <span class="image-fallback">รูปสินค้าโหลดไม่ได้ กรุณาตรวจสอบว่าไฟล์ Google Drive ตั้งค่าเป็น “ทุกคนที่มีลิงก์”</span>

      <a class="hotspot" href="https://d-sig1.vercel.app/" aria-label="เปิดหน้า SIGNATURE" style="left:6%;top:47%;width:25%;height:20%;"></a>
      <a class="hotspot" href="https://d-sig2.vercel.app/" aria-label="เปิดหน้า SIGNATURE TWO" style="left:38%;top:47%;width:25%;height:20%;"></a>
      <a class="hotspot" href="https://d-col.vercel.app/" aria-label="เปิดหน้า COLLECTIONS" style="left:69%;top:47%;width:25%;height:20%;"></a>
    </section>
  </main>
</body>
</html>
